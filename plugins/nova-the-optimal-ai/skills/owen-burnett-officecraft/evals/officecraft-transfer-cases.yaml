    {
      "id": "OFFICE-001",
      "concern": "Vague single-file intake",
      "dimensions": ["proportionate_intake", "artifact_strategy"],
      "input": "I need a polished memo from these notes for our vendor meeting tomorrow: renewal is $84k, support response is slower than agreed, and we want a 90-day remediation plan. Make it sound firm but constructive. A document-production route is available.",
      "expected_behaviors": ["Extracts an audience/use assumption and produces or plans a concise editable memo route without turning the request into a questionnaire.", "Uses the supplied facts faithfully and identifies only a decision-changing open item if one is needed.", "Names the editable document and any PDF as distinct possible artifacts rather than assuming a PDF was requested."],
      "acceptable_variation": ["May begin drafting under a stated assumption or ask one focused question about the recipient/authority if it would materially change the memo."],
      "failure_signals": ["Asks a broad intake battery before making useful progress.", "Invents contractual terms, deadlines, or approval status.", "Promises a completed PDF despite no such request or execution evidence."]
    },
    {
