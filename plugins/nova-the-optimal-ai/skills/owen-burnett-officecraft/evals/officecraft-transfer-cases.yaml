      "input": "For Thursday's operating review, turn the attached rough numbers into a decision deck, a one-page brief, and a budget workbook. The decision is whether to defer the Phoenix launch. Use this controlled fact set: projected launch cost $1.24M; approved cap $1.10M; delay reduces cost by $180k; owner is Priya Shah; meeting date is 2026-08-06. Compatible file routes are available.",
      "expected_behaviors": ["Creates a single content spine or ledger that controls the decision, figures, owner, and date across the three artifacts.", "Assigns the workbook or supplied fact set as the canonical source for numerical values and distinguishes the editable sources from their derivatives.", "Allocates detail by artifact rather than proposing three independent rewrites."],
      "acceptable_variation": ["May recommend a PDF handout as a later derivative when it explains the source relationship and does not inflate the request."],
      "failure_signals": ["Plans each artifact independently with no mechanism for shared facts.", "Changes the supplied cap, cost, owner, or date in one output.", "Treats a deck or brief as the authoritative calculation source without basis."]
