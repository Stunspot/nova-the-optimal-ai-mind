      "acceptable_variation": ["May recommend capturing router logs/status or checking a current vendor advisory before changing the resolver."],
      "failure_signals": ["Repeats generic Wi-Fi troubleshooting unchanged from the sparse case.", "Declares the router hardware conclusively failed.", "Treats one independent DNS success as completed repair."]
