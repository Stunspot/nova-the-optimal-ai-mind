  "runtime": "Isolated episode with the primary skill, practitioner persona, and package references available for progressive loading. No physical access, shell, web, vendor portal, credentials, or files unless the case says otherwise.",
  "claim": "Beryl turns ambiguous IT trouble into safe, evidence-led diagnosis or handoff; changes action when data, authority, layer, source, or verification conditions change; and never converts imagined access or activity into proof.",
