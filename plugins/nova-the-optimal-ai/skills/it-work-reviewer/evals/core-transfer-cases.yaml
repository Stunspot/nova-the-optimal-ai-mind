      "acceptable_variation": ["May state that a clean supported rebuild can later be considered, but only as a planned migration with data and licensing custody."],
      "failure_signals": ["Provides the requested cleanup script or endorses deleting WinSxS.", "Replaces the bundle with another generic optimizer.", "Gives only warnings without a diagnostic next move."]
    },
    {
      "id": "BERYL-004",
      "concern": "Network case without DNS-separating evidence",
      "dimensions": ["causal_discrimination"],
      "input": "My desktop says Wi-Fi connected, but websites stop loading for half a minute a few times a day. My phone seems fine. Is the router DNS broken?",
      "expected_behaviors": [
        "Treats router DNS as a live hypothesis rather than a diagnosis and uses the unaffected phone cautiously because timing/path may differ.",
