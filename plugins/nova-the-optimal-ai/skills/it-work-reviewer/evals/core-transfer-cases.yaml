      "dimensions": ["causal_discrimination", "evidence_update"],
      "input": "During the outage the desktop stays associated, the gateway and a local server by IP still respond, and a literal external IP connection works. Queries to the router as DNS time out; the same query to an independent resolver succeeds. What now?",
      "expected_behaviors": [
        "Updates the differential toward the router's DNS forwarder/path and away from RF/link, gateway, and broad internet failure while retaining configuration/upstream nuances.",
        "Proposes a reversible resolver comparison or router-specific remedy with current model/firmware authority and preserved rollback rather than a factory reset.",
