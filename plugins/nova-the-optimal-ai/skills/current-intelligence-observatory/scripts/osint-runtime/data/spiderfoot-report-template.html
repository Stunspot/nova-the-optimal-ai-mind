<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SpiderFoot relationships</title><style>body{margin:0;background:#171b1a;color:#e9e5d8;font:16px system-ui}header,section{padding:20px}h1{margin:0}button,input{font:inherit;background:#292f2b;color:inherit;border:1px solid #69755b;padding:8px;border-radius:4px}svg{width:100%;height:60vh;display:block;background:#202620}line{stroke:#737e70;stroke-width:1.5}circle{fill:#b8d092;stroke:#dae6c8;stroke-width:2;cursor:grab}text{fill:#e9e5d8;font:13px system-ui;pointer-events:none}.muted{opacity:.18}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #424c40;overflow-wrap:anywhere}#status{color:#c4cba9}#selection{min-height:24px}a{color:#b8d092}</style><header><h1>SpiderFoot relationships</h1><p id="status"></p><label>Find a node <input id="filter" type="search"></label> <button id="reset">Show all</button><p id="selection">Select a node to highlight its connections. Drag nodes to rearrange.</p></header><svg id="view" role="img" aria-label="Observed relationships from SpiderFoot event provenance" viewBox="0 0 1200 650"></svg><section><h2>Source events</h2><p>Edges record discovery provenance. They do not establish common identity or ownership.</p><table><thead><tr><th>Type</th><th>Data</th><th>Source data</th><th>Module</th></tr></thead><tbody id="events"></tbody></table></section><script>
const report=__SPIDERFOOT_DATA__;
const graph=report.graph, ns='http://www.w3.org/2000/svg', view=document.getElementById('view'), positions=new Map(),groups=new Map(),lines=[];
document.getElementById('status').textContent=(report.fixture?'SYNTHETIC DEMO • ':'')+report.target+' • '+graph.nodes.length+' nodes • '+graph.edges.length+' connections';
function element(name,attrs){const el=document.createElementNS(ns,name);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);return el}
graph.nodes.forEach((n,i)=>{const angle=2*Math.PI*i/Math.max(graph.nodes.length,1);positions.set(n.id,{x:600+420*Math.cos(angle),y:325+235*Math.sin(angle)})});
graph.edges.forEach(e=>{let line=element('line',{});view.append(line);lines.push([line,e])});
function highlight(ids){groups.forEach((g,id)=>g.classList.toggle('muted',ids&&!ids.has(id)));lines.forEach(([el,e])=>el.classList.toggle('muted',ids&&(!ids.has(e.source)||!ids.has(e.target))))}
function select(n){const ids=new Set([n.id]);graph.edges.forEach(e=>{if(e.source===n.id)ids.add(e.target);if(e.target===n.id)ids.add(e.source)});highlight(ids);document.getElementById('selection').textContent=n.label+' • '+(ids.size-1)+' connected nodes'}
graph.nodes.forEach(n=>{const g=element('g',{tabindex:0,role:'button','aria-label':n.label}),c=element('circle',{r:11}),t=element('text',{x:16,y:4});t.textContent=n.label;g.append(c,t);view.append(g);groups.set(n.id,g);g.addEventListener('click',()=>select(n));g.addEventListener('keydown',e=>{if(e.key==='Enter')select(n)});g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);g.dataset.drag='1'});g.addEventListener('pointerup',()=>delete g.dataset.drag);g.addEventListener('pointermove',e=>{if(!g.dataset.drag)return;const p=view.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(view.getScreenCTM().inverse());positions.set(n.id,{x:q.x,y:q.y});draw()})});
function draw(){groups.forEach((g,id)=>{const p=positions.get(id);g.setAttribute('transform',`translate(${p.x},${p.y})`)});lines.forEach(([el,e])=>{const a=positions.get(e.source),b=positions.get(e.target);if(a&&b){el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y)}})}draw();
document.getElementById('filter').addEventListener('input',e=>{const q=e.target.value.toLowerCase();highlight(q?new Set(graph.nodes.filter(n=>n.label.toLowerCase().includes(q)).map(n=>n.id)):null)});document.getElementById('reset').onclick=()=>{highlight(null);document.getElementById('filter').value='';document.getElementById('selection').textContent='Select a node to highlight its connections. Drag nodes to rearrange.'};
report.events.forEach(e=>{const tr=document.createElement('tr');['type','data','source_data','module'].forEach(key=>{const td=document.createElement('td');td.textContent=e[key];tr.append(td)});document.getElementById('events').append(tr)});
</script></html>
