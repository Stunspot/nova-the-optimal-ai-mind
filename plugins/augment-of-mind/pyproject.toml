[build-system]
requires = ["setuptools>=69.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-mind-core"
version = "0.2.0"
description = "Persona-neutral local metadata runtime for MIND."
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Collaborative Dynamics" }]

[project.scripts]
mind-core = "mind_core.cli:main"

[tool.setuptools.packages.find]
include = ["mind_core*"]

[tool.setuptools.package-data]
mind_core = ["migrations/*.sql"]
