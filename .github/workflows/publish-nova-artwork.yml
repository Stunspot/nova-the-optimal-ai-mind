name: Publish canonical Nova artwork with Pages

on:
  push:
    paths:
      - .github/workflows/publish-nova-artwork.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy and verify canonical raster artwork
        run: |
          python -m pip install --quiet pillow
          mkdir -p docs/assets
          cp assets/nova-emergent.png docs/assets/nova-emergent.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path('assets/nova-emergent.png')
          output = Path('docs/assets/nova-emergent.png')
          source_bytes = source.read_bytes()
          output_bytes = output.read_bytes()
          if source_bytes != output_bytes:
              raise SystemExit('Canonical artwork copy is not byte-identical')
          image = Image.open(output)
          if image.format != 'PNG' or image.width < 512 or image.height < 512:
              raise SystemExit(f'Unexpected canonical raster: {image.format} {image.size}')
          print(f'Verified byte-identical canonical artwork: PNG {image.width}x{image.height}, {output.stat().st_size} bytes')
          PY
      - name: Commit the asset and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/nova-emergent.png
          git rm .github/workflows/publish-nova-artwork.yml
          git commit -m "Publish canonical Nova artwork with the Pages site"
          git push
