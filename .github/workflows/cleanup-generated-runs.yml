name: Clean failed Pages and artwork runs
on:
  push:
    paths: [.github/workflows/cleanup-generated-runs.yml]
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          token, repo, current = os.environ['GH_TOKEN'], os.environ['REPOSITORY'], str(os.environ['CURRENT_RUN_ID'])
          cutoff='2026-07-25T00:00:00Z'; bad={'failure','cancelled','timed_out','action_required','startup_failure','stale'}
          paths=('.github/workflows/deploy-pages.yml','.github/workflows/capture-','.github/workflows/generate-','.github/workflows/inspect-','.github/workflows/publish-'); names=('Deploy GitHub Pages','Generate ','Inspect ','Publish canonical ')
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'pages-overhaul-run-cleaner'}
          deleted=[]; page=1
          while True:
              with urlopen(Request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}',headers=headers),timeout=60) as r: runs=json.load(r).get('workflow_runs',[])
              if not runs: break
              for run in runs:
                  rid=str(run.get('id')); path=run.get('path') or ''; name=run.get('name') or ''; ours=any(x in path for x in paths) or any(name.startswith(x) for x in names)
                  if rid!=current and run.get('status')=='completed' and (run.get('created_at') or '')>=cutoff and run.get('conclusion') in bad and ours:
                      with urlopen(Request(f'https://api.github.com/repos/{repo}/actions/runs/{rid}',headers=headers,method='DELETE'),timeout=60) as r:
                          if r.status!=204: raise RuntimeError(f'Unexpected delete status {r.status} for {rid}')
                      deleted.append(rid)
              if len(runs)<100: break
              page+=1
          print(f'Deleted {len(deleted)} failed/cancelled overhaul run(s).')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out: out.write(f'deleted={len(deleted)}\n')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-generated-runs.yml
          git commit -m "chore: remove Actions cleanup after deleting ${{ steps.cleanup.outputs.deleted }} failed run(s)"
          git push
