name: One-time Arm's Reach 2.1.4 synchronization

on:
  push:
    branches:
      - agent/stop-capability-catalog-roaming
    paths:
      - .github/workflows/one-time-arm-reach-2-1-4.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stop-capability-catalog-roaming
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize version, verification, and documentation surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()
          OLD_HEADER = "**Vector-near semantically related capabilities below**: surfaced from RAG memory for this turn as associative presentation of surveyed capabilities. Consider such reminders as suggested subset of available praxis affordances, not suggested courses of action. Assess contextual relevance and consider exploring candidate capacities of likely utility to task. Adjunct helper system to others (eg. tools/skills/mcps from harness configuration). Often holds capabilities not harness-installed."
          NEW_HEADER = "**Vector-near semantically related capabilities below**: surfaced from RAG memory for this turn as associative presentation of surveyed capabilities. Consider such reminders as suggested subset of available praxis affordances, not suggested courses of action. Assess contextual relevance and likely utility to task. Integrate with capabilities already present in assembled context. Surveyed memory may extend beyond the current harness."

          def text(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              (ROOT / path).write_text(value, encoding="utf-8", newline="\n")

          def replace_once(path: str, old: str, new: str) -> None:
              value = text(path)
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence of {old!r}, found {count}")
              write(path, value.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> None:
              value = text(path)
              count = value.count(old)
              if count < minimum:
                  raise RuntimeError(f"{path}: expected at least {minimum} occurrences of {old!r}, found {count}")
              write(path, value.replace(old, new))

          replace_once(
              "plugins/augment-of-mind/scripts/verify_release.py",
              'PLUGIN_VERSION = "2.1.3"',
              'PLUGIN_VERSION = "2.1.4"',
          )
          replace_all(
              "plugins/augment-of-mind/scripts/build_integrated_fingerprint.py",
              '2.1.3',
              '2.1.4',
              minimum=2,
          )
          replace_once(
              "plugins/augment-of-mind/skills/augment-of-mind/references/faculty-runtime/faculty-registry.json",
              '"runtime_version": "2.1.3"',
              '"runtime_version": "2.1.4"',
          )
          replace_once(
              "plugins/augment-of-mind/install.ps1",
              "MIND 2.1.3 is installed",
              "MIND 2.1.4 is installed",
          )
          replace_once(
              "verify-install.ps1",
              "expected_version = '2.1.3'",
              "expected_version = '2.1.4'",
          )
          replace_all(
              "tests/test_windows_powershell_compatibility.py",
              "2.1.3",
              "2.1.4",
          )
          replace_once(
              "tools/build_release.py",
              'VERSION = "2.0.5"',
              'VERSION = "2.0.6"',
          )
          replace_once(
              "tools/build_release.py",
              '"augment-of-mind": "2.1.3"',
              '"augment-of-mind": "2.1.4"',
          )

          verifier = text("tools/verify_package.py")
          replacements = {
              'mind_manifest.get("version") != "2.1.3"': 'mind_manifest.get("version") != "2.1.4"',
              'MIND plugin version must be 2.1.3': 'MIND plugin version must be 2.1.4',
              '"tools/skills/mcps from harness configuration",': '"capabilities already present in assembled context",\n        "surveyed memory may extend beyond the current harness",',
              'model-context-contract-v2.1.3.json': 'model-context-contract-v2.1.4.json',
              'Product: **Nova + MIND Free 2.0.5**': 'Product: **Nova + MIND Free 2.0.6**',
          }
          for old, new in replacements.items():
              count = verifier.count(old)
              if count != 1:
                  raise RuntimeError(f"tools/verify_package.py: expected one occurrence of {old!r}, found {count}")
              verifier = verifier.replace(old, new, 1)
          forbidden_anchor = '        "hook-delivered advisory associative disclosure",\n'
          if verifier.count(forbidden_anchor) != 1:
              raise RuntimeError("tools/verify_package.py: forbidden-hook anchor changed")
          verifier = verifier.replace(
              forbidden_anchor,
              forbidden_anchor
              + '        "consider exploring candidate capacities",\n'
              + '        "tools/skills/mcps from harness configuration",\n',
              1,
          )
          contract_anchor = (
              '    if contract.get("nonvector_delivery") != "degraded":\n'
              '        errors.append("recorded model-context contract does not preserve degraded nonvector delivery")\n'
          )
          if verifier.count(contract_anchor) != 1:
              raise RuntimeError("tools/verify_package.py: contract-check anchor changed")
          verifier = verifier.replace(
              contract_anchor,
              contract_anchor
              + '    if contract.get("catalog_discovery") != "not_prompted":\n'
              + '        errors.append("recorded model-context contract prompts capability-catalog discovery")\n',
              1,
          )
          write("tools/verify_package.py", verifier)

          for path in (
              "docs/CAPABILITY-REMINDERS.md",
              "plugins/augment-of-mind/CAPABILITY-REMINDERS.md",
          ):
              replace_once(path, OLD_HEADER, NEW_HEADER)

          package_map = text("design/FREE-NOVA-PACKAGE-MAP.md")
          package_replacements = {
              "Status: verified release candidate; 2.0.5 Arm's Reach model-context correction": "Status: release candidate; 2.0.6 Arm's Reach catalog-roaming correction",
              "Product: **Nova + MIND Free 2.0.5**": "Product: **Nova + MIND Free 2.0.6**",
              "Before each model turn, the prompt-submit hook semantically associates the current prompt and a bounded recent conversation window against the active estate. It injects the resulting vector-near capability reminders as developer context before sampling; lexical identity cues may supplement a successful vector query. The model-facing preface identifies the entries as an associative presentation of surveyed capabilities, including possible tools, skills, and MCPs from the harness while allowing remembered capabilities with no harness-installed counterpart. The hook owns retrieval and delivery; receipt telemetry retains field, snapshot, mode, vector state, and hashes outside the model-facing prompt.": "Before each model turn, the prompt-submit hook semantically associates the current prompt and a bounded recent conversation window against the active estate. It injects the resulting vector-near capability reminders as developer context before sampling; lexical identity cues may supplement a successful vector query. The model-facing preface directs contextual assessment and integration with capabilities already present in assembled context, while the surveyed memory may extend beyond the current harness. The hook owns retrieval and delivery; receipt telemetry retains field, snapshot, mode, vector state, and hashes outside the model-facing prompt.",
          }
          for old, new in package_replacements.items():
              count = package_map.count(old)
              if count != 1:
                  raise RuntimeError(f"design/FREE-NOVA-PACKAGE-MAP.md: expected one occurrence of {old!r}, found {count}")
              package_map = package_map.replace(old, new, 1)
          write("design/FREE-NOVA-PACKAGE-MAP.md", package_map)

          root_notes = text("RELEASE-NOTES.md")
          root_heading = "# Nova + MIND Free release notes\n\n"
          root_section = (
              "## 2.0.6\n\n"
              "This release removes capability-catalog discovery pressure from Arm's Reach's model-facing preface. Semantic recall still arrives as vector-near surveyed praxis, while the preface now directs contextual assessment and integration with capabilities already present in assembled context. The surveyed memory may still extend beyond the current harness.\n\n"
              "A live local-model trace showed that the earlier phrases `consider exploring candidate capacities` and `tools/skills/mcps from harness configuration` prompted Codex's real plugin catalog to be enumerated and an unrelated OpenClaw URL to be misread as an MCP resource. The revised preface supports every capability already supplied by the host without inventorying its transport or requesting discovery.\n\n"
              "MIND is versioned 2.1.4 in this combined release. Capability cards, embeddings, the active estate, and user databases are unchanged.\n\n"
          )
          if "## 2.0.6\n" not in root_notes:
              if not root_notes.startswith(root_heading):
                  raise RuntimeError("RELEASE-NOTES.md title changed")
              root_notes = root_heading + root_section + root_notes[len(root_heading):]
          write("RELEASE-NOTES.md", root_notes)

          mind_notes = text("plugins/augment-of-mind/RELEASE-NOTES.md")
          mind_heading = "# MIND release notes\n\n"
          mind_section = (
              "## 2.1.4\n\n"
              "The model-facing capability-memory preface no longer asks the model to explore candidate capacities or enumerates tools, skills, and MCPs from harness configuration. It now directs contextual assessment and integration with capabilities already present in assembled context, while preserving vector-near recall and memory beyond the current harness.\n\n"
              "This removes the prompt pressure that caused one Codex-compatible local model to list the `codex_apps` plugin catalog and attempt unrelated MCP resource reads. MCP-backed and other host capabilities remain usable through the host context that already exposes them; MIND no longer inventories those transports in every turn.\n\n"
          )
          if "## 2.1.4\n" not in mind_notes:
              if not mind_notes.startswith(mind_heading):
                  raise RuntimeError("plugins/augment-of-mind/RELEASE-NOTES.md title changed")
              mind_notes = mind_heading + mind_section + mind_notes[len(mind_heading):]
          write("plugins/augment-of-mind/RELEASE-NOTES.md", mind_notes)
          PY

          python -X utf8 plugins/augment-of-mind/scripts/build_integrated_fingerprint.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          PYTHONDONTWRITEBYTECODE=1 python -X utf8 tools/verify_package.py
      - name: Commit synchronized source
        shell: bash
        run: |
          rm .github/workflows/one-time-arm-reach-2-1-4.yml
          git config user.name "Nova repository maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize MIND 2.1.4 catalog-roaming correction"
          git push origin HEAD:agent/stop-capability-catalog-roaming
