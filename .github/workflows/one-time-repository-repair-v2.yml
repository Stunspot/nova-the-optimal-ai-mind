name: One-time Nova repository repair v2

on:
  push:
    branches:
      - agent/repo-integrity-repair
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  repair-and-verify:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/repo-integrity-repair') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/repo-integrity-repair')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repo-integrity-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect whether the repair is still required
        id: repair_state
        shell: bash
        run: |
          if [[ -f .github/repair-trigger.txt ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "The verified repair commit is already present; nothing to rerun."
          fi
      - name: Apply the audited repository repair
        if: steps.repair_state.outputs.required == 'true'
        run: python -X utf8 tools/one_time_mcp_removal_repair.py
      - name: Synchronize reviewed integrity locks and verifier behavior
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source = Path("plugins/nova-the-optimal-ai/skills/promptcraft/references/prompt-design.md")
          verifier = Path("tools/verify_package.py")
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          text = verifier.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^PROMPT_DESIGN_SHA256 = "[a-f0-9]{64}"$',
              f'PROMPT_DESIGN_SHA256 = "{digest}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Promptcraft digest lock was not found exactly once")

          old_import = '''        module = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(module)
        observed_fingerprint = load_json(fingerprint_path)
'''
          guarded_import = '''        module = importlib.util.module_from_spec(spec)
        prior_dont_write_bytecode = sys.dont_write_bytecode
        try:
            sys.dont_write_bytecode = True
            spec.loader.exec_module(module)
        finally:
            sys.dont_write_bytecode = prior_dont_write_bytecode
        observed_fingerprint = load_json(fingerprint_path)
'''
          if old_import not in updated:
              raise SystemExit("Fingerprint verifier import block was not found exactly as expected")
          updated = updated.replace(old_import, guarded_import, 1)
          verifier.write_text(updated, encoding="utf-8", newline="\n")
          print(digest)
          PY
      - name: Regenerate the integrated MIND fingerprint
        if: steps.repair_state.outputs.required == 'true'
        run: python -X utf8 plugins/augment-of-mind/scripts/build_integrated_fingerprint.py
      - name: Commit the repaired source locally
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore Nova and MIND repository integrity"
      - name: Prepare deterministic build tooling
        if: steps.repair_state.outputs.required == 'true'
        run: python -m pip install --upgrade pip setuptools wheel build
      - name: Compile affected Python modules
        if: steps.repair_state.outputs.required == 'true'
        run: >-
          python -m py_compile
          tools/verify_package.py
          tools/build_release.py
          plugins/augment-of-mind/hooks/mind_prompt_submit.py
          plugins/augment-of-mind/mind_core/contextual_recall.py
          plugins/augment-of-mind/scripts/verify_release.py
          plugins/augment-of-mind/scripts/build_release.py
          plugins/augment-of-mind/scripts/build_integrated_fingerprint.py
      - name: Remove compile caches before package verification
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Verify the fingerprint is reproducible
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: |
          python -X utf8 plugins/augment-of-mind/scripts/build_integrated_fingerprint.py
          git diff --exit-code -- plugins/augment-of-mind/skills/augment-of-mind/assets/integrated-capability-fingerprint.json
      - name: Verify the source package
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: python -X utf8 tools/verify_package.py | tee /tmp/source-verification.json
      - name: Build the combined customer package
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: python -X utf8 tools/build_release.py | tee /tmp/combined-build.json
      - name: Verify the combined customer package
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: python -X utf8 tools/verify_package.py --release | tee /tmp/combined-verification.json
      - name: Build and verify standalone MIND
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: |
          rm -rf /tmp/mind-release
          python -X utf8 plugins/augment-of-mind/scripts/build_release.py --output-dir /tmp/mind-release --replace | tee /tmp/mind-build.json
      - name: Confirm verification created no tracked drift
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: git diff --exit-code HEAD -- . ':!release' ':!dist'
      - name: Publish the verified repair commit to the repair branch
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: git push origin HEAD:agent/repo-integrity-repair
      - name: Upload audit evidence
        if: steps.repair_state.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-mind-repository-audit
          path: |
            /tmp/source-verification.json
            /tmp/combined-build.json
            /tmp/combined-verification.json
            /tmp/mind-build.json
            /tmp/mind-release/*.json
            /tmp/mind-release/*.sha256
            release/nova-mind-free-v2.0.3.zip.sha256
            plugins/augment-of-mind/skills/augment-of-mind/assets/integrated-capability-fingerprint.json
