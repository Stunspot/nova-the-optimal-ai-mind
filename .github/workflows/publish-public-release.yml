name: Publish Nova and MIND Free

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-v2-0-3:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/publish-nova-mind-v2.0.3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source package
        shell: bash
        run: python -X utf8 tools/verify_package.py | tee /tmp/source-verification.json
      - name: Build deterministic customer package
        shell: bash
        run: python -X utf8 tools/build_release.py | tee /tmp/build-result.json
      - name: Verify customer package
        shell: bash
        run: python -X utf8 tools/verify_package.py --release | tee /tmp/release-verification.json
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag='v2.0.3'
          assets=(
            release/nova-mind-free-v2.0.3.zip
            release/nova-mind-free-v2.0.3.zip.sha256
            dist/release-manifest.json
            dist/SHA256SUMS.txt
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target main \
              --title 'Nova + MIND Free 2.0.3' \
              --notes-file RELEASE-NOTES.md
          fi
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: published-nova-mind-free-v2.0.3
          path: |
            release/nova-mind-free-v2.0.3.zip
            release/nova-mind-free-v2.0.3.zip.sha256
            dist/release-manifest.json
            dist/SHA256SUMS.txt
            /tmp/source-verification.json
            /tmp/build-result.json
            /tmp/release-verification.json
