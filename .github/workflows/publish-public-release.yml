name: Publish Nova and MIND Free

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-v2-0-3:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/publish-nova-mind-v2-0-3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source package
        shell: bash
        run: python -X utf8 tools/verify_package.py | tee /tmp/source-verification.json
      - name: Build deterministic customer package
        shell: bash
        run: python -X utf8 tools/build_release.py | tee /tmp/build-result.json
      - name: Verify customer package
        shell: bash
        run: python -X utf8 tools/verify_package.py --release | tee /tmp/release-verification.json
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag='v2.0.3'
          assets=(
            release/nova-mind-free-v2.0.3.zip
            release/nova-mind-free-v2.0.3.zip.sha256
            dist/release-manifest.json
            dist/SHA256SUMS.txt
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target main \
              --title 'Nova + MIND Free 2.0.3' \
              --notes-file RELEASE-NOTES.md
          fi
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: published-nova-mind-free-v2.0.3
          path: |
            release/nova-mind-free-v2.0.3.zip
            release/nova-mind-free-v2.0.3.zip.sha256
            dist/release-manifest.json
            dist/SHA256SUMS.txt
            /tmp/source-verification.json
            /tmp/build-result.json
            /tmp/release-verification.json

  # BEGIN ONE-TIME FINALIZER
  finalize-v2-0-3-public-docs:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/finalize-public-docs-v2-0-3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect one-use finalization marker
        id: finalization
        shell: bash
        run: |
          if [[ -f .github/FINALIZE-PUBLIC-DOCS.md ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Finalize public download and release content
        if: steps.finalization.outputs.required == 'true'
        run: python -X utf8 tools/finalize_public_release.py
      - name: Commit finalized source locally
        if: steps.finalization.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize Nova + MIND Free 2.0.3 public release content'
      - name: Verify finalized source
        if: steps.finalization.outputs.required == 'true'
        shell: bash
        run: python -X utf8 tools/verify_package.py | tee /tmp/final-source-verification.json
      - name: Build finalized package
        if: steps.finalization.outputs.required == 'true'
        shell: bash
        run: python -X utf8 tools/build_release.py | tee /tmp/final-build-result.json
      - name: Verify finalized package
        if: steps.finalization.outputs.required == 'true'
        shell: bash
        run: python -X utf8 tools/verify_package.py --release | tee /tmp/final-release-verification.json
      - name: Push finalized verified source
        if: steps.finalization.outputs.required == 'true'
        shell: bash
        run: git push origin HEAD:${{ github.head_ref }}
      - name: Upload finalization evidence
        if: steps.finalization.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finalized-nova-mind-free-v2.0.3
          path: |
            release/nova-mind-free-v2.0.3.zip
            release/nova-mind-free-v2.0.3.zip.sha256
            dist/release-manifest.json
            dist/SHA256SUMS.txt
            /tmp/final-source-verification.json
            /tmp/final-build-result.json
            /tmp/final-release-verification.json
  # END ONE-TIME FINALIZER
