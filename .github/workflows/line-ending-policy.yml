name: Line ending policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  line-ending-policy:
    name: line-ending-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Stunspot/testforge/line-ending-policy@24b9b3d5ee375ec7e19a619624bcfc4a7ddb887d

  publish-nova-mind-2-0-3:
    name: publish-nova-mind-2.0.3
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/trigger-release-2.0.3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize release metadata in build workspace
        shell: python
        run: |
          from pathlib import Path

          def converge(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'cannot synchronize {path}: neither expected value is present')
              target.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          converge('tools/build_release.py', 'VERSION = "2.0.2"', 'VERSION = "2.0.3"')
          converge('tools/build_release.py', '"augment-of-mind": "2.1.0"', '"augment-of-mind": "2.1.1"')
          converge('tools/verify_package.py', '2.1.0', '2.1.1')
          converge('plugins/augment-of-mind/.codex-plugin/plugin.json', '"version": "2.1.0"', '"version": "2.1.1"')
          converge('plugins/augment-of-mind/scripts/verify_release.py', 'PLUGIN_VERSION = "2.1.0"', 'PLUGIN_VERSION = "2.1.1"')
          converge('plugins/augment-of-mind/scripts/build_integrated_fingerprint.py', '2.1.0', '2.1.1')
          converge('plugins/augment-of-mind/skills/augment-of-mind/evals/eval-manifest.yaml', '"package_version": "2.1.0"', '"package_version": "2.1.1"')
          converge('plugins/augment-of-mind/skills/augment-of-mind/evals/faculty-runtime-cases.yaml', '"package_version": "2.1.0"', '"package_version": "2.1.1"')

          package_map = Path('design/FREE-NOVA-PACKAGE-MAP.md')
          text = package_map.read_text(encoding='utf-8')
          text = text.replace(
              'Status: published product; 2.0.2 presentation correction in progress',
              'Status: published product; 2.0.3 removes bundled Nova/MIND MCP runtime plumbing',
          ).replace(
              'Status: release candidate; 2.0.3 removes bundled Nova/MIND MCP runtime plumbing',
              'Status: published product; 2.0.3 removes bundled Nova/MIND MCP runtime plumbing',
          ).replace('Product: **Nova + MIND Free 2.0.2**', 'Product: **Nova + MIND Free 2.0.3**')
          package_map.write_text(text, encoding='utf-8', newline='\n')

          mind_notes = Path('plugins/augment-of-mind/RELEASE-NOTES.md')
          text = mind_notes.read_text(encoding='utf-8')
          section = '''## 2.1.1

This patch removes MIND's bundled MCP server, `.mcp.json` registration, launcher, and automatic `associate_capabilities` request. MIND skills remain filesystem capabilities loaded through `SKILL.md`; the prompt hook and bundled local query script retain the non-MCP association path.

The package does not prohibit or modify unrelated MCP servers configured independently by the user or host.

'''
          if '## 2.1.1' not in text:
              text = text.replace('## 2.1.0\n', section + '## 2.1.0\n', 1)
          mind_notes.write_text(text, encoding='utf-8', newline='\n')
      - name: Regenerate integrated MIND fingerprint
        run: python -X utf8 plugins/augment-of-mind/scripts/build_integrated_fingerprint.py
      - name: Verify source package
        run: python -X utf8 tools/verify_package.py
      - name: Build customer package
        run: python -X utf8 tools/build_release.py
      - name: Verify customer package
        run: python -X utf8 tools/verify_package.py --release
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('tools/build_release.py').read_text(encoding='utf-8')
          print(re.search(r'^VERSION = "([^"]+)"$', text, re.MULTILINE).group(1))
          PY
          )"
          tag="v${version}"
          target="$(git rev-parse HEAD)"
          assets=(
            "release/nova-mind-free-v${version}.zip"
            "release/nova-mind-free-v${version}.zip.sha256"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$target" \
              --title "Nova + MIND Free ${version}" \
              --notes-file RELEASE-NOTES.md
          fi
