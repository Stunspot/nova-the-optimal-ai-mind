name: Manual verify Nova Free candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run repository regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Build deterministic customer package
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -X utf8 tools/build_release.py
      - name: Verify built customer package
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -X utf8 tools/verify_package.py dist/nova-the-optimal-ai-free-3.1.2
